<!-- Open1602 application icon: simplified compass rose for 16 to 32 px. Source of every icon size (tools/make_icons.py). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="hsst" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2cfa4"/>
      <stop offset="1" stop-color="#86704a"/>
    </linearGradient>
    <radialGradient id="hspa" cx=".45" cy=".4" r=".65">
      <stop offset="0" stop-color="#f3e2b8"/>
      <stop offset="1" stop-color="#c7a46a"/>
    </radialGradient>
    <linearGradient id="hsg" gradientUnits="userSpaceOnUse" x1="50" y1="40" x2="210" y2="230">
      <stop offset="0" stop-color="#fdeaa6"/>
      <stop offset=".45" stop-color="#dba53c"/>
      <stop offset="1" stop-color="#7d4f10"/>
    </linearGradient>
    <filter id="hsbv" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feSpecularLighting in="b" surfaceScale="6" specularConstant=".9" specularExponent="18" lighting-color="#fff4d8" result="s">
        <feDistantLight azimuth="225" elevation="38"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
      <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k2="1" k3=".75"/>
    </filter>
    <filter id="hsbg" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b"/>
      <feSpecularLighting in="b" surfaceScale="2" specularConstant=".9" specularExponent="18" lighting-color="#fff4d8" result="s">
        <feDistantLight azimuth="225" elevation="50"/>
      </feSpecularLighting>
      <feComposite in="s" in2="SourceAlpha" operator="in" result="si"/>
      <feComposite in="SourceGraphic" in2="si" operator="arithmetic" k2="1" k3=".75"/>
    </filter>
    <filter id="hsgr" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.05" numOctaves="4" seed="9" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.3 0 0 0 0 0.22 0 0 0 0 0.12 -1.6 0 0 0 0.9" result="g"/>
      <feComposite in="g" in2="SourceAlpha" operator="in" result="gi"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="gi"/>
      </feMerge>
    </filter>
    <filter id="hspp" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.03" numOctaves="4" seed="5" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45 0 0 0 0 0.3 0 0 0 0 0.12 -1.4 0 0 0 0.75" result="g"/>
      <feComposite in="g" in2="SourceAlpha" operator="in" result="gi"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="gi"/>
      </feMerge>
    </filter>
    <filter id="hssd" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <g filter="url(#hssd)">
    <g >
      <circle cx="128" cy="128" r="120" fill="url(#hsst)" />
    </g>
  </g>
  <circle cx="128" cy="128" r="94" fill="url(#hsg)" />
  <circle cx="128" cy="128" r="84" fill="url(#hspa)" />
  <g filter="url(#hssd)">
    <path d="M128 128 L112.4 112.4 L128.0 48.0 Z" fill="#d0402a"/>
    <path d="M128 128 L128.0 48.0 L143.6 112.4 Z" fill="#7e1c12"/>
    <path d="M128 128 L143.6 112.4 L208.0 128.0 Z" fill="#f6dc8e"/>
    <path d="M128 128 L208.0 128.0 L143.6 143.6 Z" fill="#a26a1c"/>
    <path d="M128 128 L143.6 143.6 L128.0 208.0 Z" fill="#f6dc8e"/>
    <path d="M128 128 L128.0 208.0 L112.4 143.6 Z" fill="#a26a1c"/>
    <path d="M128 128 L112.4 143.6 L48.0 128.0 Z" fill="#f6dc8e"/>
    <path d="M128 128 L48.0 128.0 L112.4 112.4 Z" fill="#a26a1c"/>
  </g>
  <circle cx="128" cy="128" r="11" fill="url(#hsg)" stroke="#5a3a1a" stroke-width="1.5"/>
</svg>
